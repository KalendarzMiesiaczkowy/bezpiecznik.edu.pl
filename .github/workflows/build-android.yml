name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Java (17 dla Androida)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja narzędzia uv
        run: pip install uv

      - name: Konfiguracja środowiska Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache danych OSM i Planetilera
        uses: actions/cache@v4
        with:
          path: ~/development
          key: dev-osm-planetiler-v1

      - name: Instalacja zależności Fluttera
        working-directory: ./app
        run: flutter pub get

      - name: Generowanie mapy i assetów
        working-directory: ./app
        env:
          PLANETILER_XMX: 5g
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/development/data
          if [ ! -s ~/development/data/zachodniopomorskie-latest.osm.pbf ]; then
          gh release download data-v1 -p "zachodniopomorskie-latest.osm.pbf" -D ~/development/data
          fi
          bash ../tools/build_tiles.sh
          uv run --script ../tools/build_knowledge.py
          uv run --script ../tools/build_points.py
          uv run --script ../tools/build_guides.py

      - name: Analiza kodu
        working-directory: ./app
        run: flutter analyze

      - name: Kompilacja APK (Release)
        working-directory: ./app
        run: flutter build apk --release

      - name: Udostępnienie pliku APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

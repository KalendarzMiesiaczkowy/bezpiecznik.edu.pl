name: Build Flutter Web

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Włączenie obsługi platformy Web we Flutterze
        working-directory: ./app
        run: flutter config --enable-web

      - name: Instalacja zależności
        working-directory: ./app
        run: flutter pub get

      - name: Kompilacja wersji Web
        working-directory: ./app
        run: flutter build web --release

      - name: Udostępnienie plików statycznych (Web)
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: app/build/web/
